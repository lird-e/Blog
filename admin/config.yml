# Sveltia CMS 配置（兼容 Decap CMS 配置格式）
# 文档：https://sveltiacms.app/en/docs
#
site_url: https://lird-e.github.io/Blog
base_url: /Blog/

backend:
  name: github
  repo: lird-e/Blog
  branch: main
  # 认证方式：Personal Access Token（Sveltia 登录页内置"Sign In with Token"）。
  # 注意：不要在此配置 app_id——GitHub backend 不支持 PKCE（该字段仅 GitLab 有效），
  # 若未来要 OAuth 按钮登录，需部署 OAuth 代理并在 backend 加 base_url 指向代理地址。

# 发布模式：simple = 保存即直接提交并上线；editorial_workflow = 走草稿/审核流程
publish_mode: simple

# 图片等媒体文件存放位置（相对仓库根目录 / 站点访问路径）
media_folder: "assets/uploads"
# 站点部署在 /Blog/ 子路径下，public_folder 必须带子路径前缀，
# 否则 CMS 插入正文的图片链接 /assets/... 会解析到域名根导致 404
public_folder: "/Blog/assets/uploads"

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title,   label: "标题", widget: string }
      # Sveltia 已废弃 widget: date，必须用 datetime + type: date；
      # format 保持 YYYY-MM-DD 与现有文章 frontmatter 及 build.py 的解析一致
      - { name: date,    label: "日期", widget: datetime, type: date, format: "YYYY-MM-DD", required: false }
      - { name: tags,    label: "标签", widget: list, required: false, summary: "标签" }
      - { name: excerpt, label: "摘要", widget: string, required: false }
      - { name: body,    label: "正文", widget: markdown }
