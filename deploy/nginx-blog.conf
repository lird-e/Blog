# Nginx 站点配置：部署到 /etc/nginx/sites-available/blog，
# 软链到 sites-enabled 后 nginx -t && systemctl reload nginx。
# http 块内需先定义限流区域（见 deploy/README.md 初始化步骤）。

server {
    listen 80;
    server_name _;

    root /var/blog/web/dist;
    index index.html;

    # 上传体积上限：Nginx 默认 1m，长文（后端允许 20 万字符，中文按 UTF-8 可达 600KB+）
    # 叠加 JSON 转义后会顶到默认上限，管理员保存文章会被 413 拦下。
    client_max_body_size 4m;

    # 基础安全头（普通 location 自动继承；下方自带 add_header 的 location 内已重复声明）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：本站内容全部自控——index.html 的内联主题脚本与 React 内联样式需要
    # unsafe-inline；评论区头像来自 cravatar.cn 与 GitHub。后续接入第三方
    # 脚本/字体时需同步扩白名单。全站无外链图片资源，img 白名单即头像两处。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cravatar.cn https://avatars.githubusercontent.com data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # 前端路由兜底（React Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页不缓存：保证发版后老用户立即拿到新 HTML（引用新的 hash 文件名）
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cravatar.cn https://avatars.githubusercontent.com data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的构建产物（Vite 输出的 js/css 文件名即内容指纹）：一年 + immutable
    # 正则优先级高于下面的普通前缀 /assets/，博客图片（png/jpg/svg）不受影响
    location ~* ^/assets/.+\.(js|mjs|css)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cravatar.cn https://avatars.githubusercontent.com data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 博客图片等稳定路径资源：7 天；缺失文件显式 404（防御性：不依赖静态模块默认行为）
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cravatar.cn https://avatars.githubusercontent.com data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # 公开 API（限流：每 IP 10 r/s，burst 20）
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # 管理 API（限流更严：每 IP 1 r/s，burst 5）
    location /api/admin/ {
        limit_req zone=admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # SEO 动态输出（Go 端生成）
    location ~ ^/(rss\.xml|sitemap\.xml|robots\.txt)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_min_length 1k;
    # application/xml：sitemap 由 Go 端输出（seo.go），缺了它 sitemap 不压缩
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/xml application/rss+xml;
}
