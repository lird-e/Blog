<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 移动端浏览器地址栏配色：随明暗主题切换（下方脚本初始化/更新） -->
<meta name="theme-color" content="#ffffff">
<script>
(function(){
  try{
    var t = localStorage.getItem('theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m){ m.setAttribute('content', t === 'dark' ? '#0d1117' : '#ffffff'); }
  }catch(e){}
})();
</script>
<title>{{title}} - 我的博客</title>
<link rel="stylesheet" href="{{base}}assets/style.css?v={{css_ver}}">
<link rel="stylesheet" href="{{base}}assets/pygments.css?v={{css_ver}}">
<link rel="stylesheet" href="{{base}}assets/pygments-dark.css?v={{css_ver}}">
<link rel="alternate" type="application/rss+xml" title="我的博客" href="{{base}}feed.xml">
<link rel="icon" type="image/svg+xml" href="{{base}}assets/favicon.svg">
{{extra_head}}
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="{{base}}index.html" class="logo">我的博客</a>
    <nav>
      <a href="{{base}}index.html">首页</a>
      <a href="{{base}}tags.html">标签</a>
      <a href="{{base}}search.html">搜索</a>
      <a href="{{base}}about.html">关于</a>
      <a id="admin-link" class="admin-only" href="{{base}}admin" style="display:none;">写文章</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm-6.364-2a.75.75 0 0 1-.75-.75v-.5a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-.75.75h-1ZM13.364 7.75a.75.75 0 0 1-.75-.75v-.5a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 .75.75v.5a.75.75 0 0 1-.75.75h-1ZM8 1.636a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75v-1a.75.75 0 0 1 .75-.75h.5ZM8 12.364a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-.75.75h-.5a.75.75 0 0 1-.75-.75v-1a.75.75 0 0 1 .75-.75h.5ZM2.343 3.404a.75.75 0 0 1 1.06 0l.707.707a.75.75 0 0 1-1.06 1.061l-.707-.707a.75.75 0 0 1 0-1.061ZM11.89 12.95a.75.75 0 0 1 1.06 0l.707.707a.75.75 0 0 1-1.06 1.061l-.707-.707a.75.75 0 0 1 0-1.061ZM2.343 12.596a.75.75 0 0 1 0-1.06l.707-.707a.75.75 0 0 1 1.061 1.06l-.707.708a.75.75 0 0 1-1.061 0ZM11.89 3.05a.75.75 0 0 1 0-1.06l.707-.707a.75.75 0 0 1 1.061 1.06l-.707.707a.75.75 0 0 1-1.061 0Z"/></svg>
        <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.598 1.591a.75.75 0 0 1 .785-.175 7 7 0 1 1-9.9 9.9.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.07-7.07.75.75 0 0 1 .084-.765Z"/></svg>
      </button>
    </nav>
  </div>
</header>
<main class="container">
{{content}}
</main>
<footer class="site-footer">
  <div class="container">© 2026 我的博客</div>
</footer>
<script>
document.getElementById('theme-toggle')?.addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme') || 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
  var m = document.querySelector('meta[name="theme-color"]');
  if(m){ m.setAttribute('content', next === 'dark' ? '#0d1117' : '#ffffff'); }
});
// 仅当博客在本地运行（serve.py）时显示「写文章」入口，云端部署自动隐藏
(function(){
  var h = location.hostname;
  if(h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0'){
    var a = document.getElementById('admin-link');
    if(a){ a.style.display = 'inline'; }
  }
})();
</script>
</body>
</html>
